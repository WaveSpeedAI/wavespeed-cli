name: Publish Package

on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: write  # Tag + GitHub Release after a successful publish

jobs:
  publish:
    if: >-
      github.repository == 'WaveSpeedAI/wavespeed-cli' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish

      # The version that just went to npm is the single source of truth:
      # tag the exact commit that was published so GitHub never drifts
      # behind the registry again. Idempotent — re-runs of the workflow
      # for an already-tagged version skip cleanly instead of failing.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VERSION already released, skipping"
            exit 0
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
