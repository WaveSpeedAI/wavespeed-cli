name: Publish Package

on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: write  # Tag + GitHub Release after a successful publish

jobs:
  publish:
    if: >-
      github.repository == 'WaveSpeedAI/wavespeed-cli' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish

      # The version that just went to npm is the single source of truth:
      # tag the exact commit that was published so GitHub never drifts
      # behind the registry again. Idempotent — re-runs of the workflow
      # for an already-tagged version skip cleanly instead of failing.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VERSION already released, skipping"
            exit 0
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes

  # Standalone executables for people without Node/npm. Attached to the release
  # the publish job just created; `wavespeed upgrade` and install.sh/install.ps1
  # download them from there and verify SHA256SUMS.
  binaries:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: wavespeed-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: wavespeed-linux-arm64 }
          - { os: macos-15, asset: wavespeed-darwin-arm64 }
          - { os: macos-15-intel, asset: wavespeed-darwin-x64 }
          - { os: windows-latest, asset: wavespeed-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/build-binary.mjs build/${{ matrix.asset }}
      - name: Smoke test
        shell: bash
        run: ./build/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}

  release-binaries:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-binaries
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist-binaries
          sha256sum wavespeed-* > SHA256SUMS
          cat SHA256SUMS
      # Verify later with: gh attestation verify <file> --repo WaveSpeedAI/wavespeed-cli
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist-binaries/wavespeed-*
            dist-binaries/SHA256SUMS
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          cd dist-binaries
          gh release upload "$VERSION" wavespeed-* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Opens a version-bump PR against microsoft/winget-pkgs after each release.
  # Off until the repository variable WINGET_AUTOUPDATE is "true": the first
  # version must already be merged in winget-pkgs, and the secret WINGET_PAT
  # (a classic personal access token with public_repo scope) must exist.
  winget:
    needs: release-binaries
    if: ${{ vars.WINGET_AUTOUPDATE == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Submit the new version to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $url = "https://github.com/WaveSpeedAI/wavespeed-cli/releases/download/v$version/wavespeed-windows-x64.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update WaveSpeedAI.WaveSpeed `
            --version $version `
            --urls $url `
            --release-notes-url "https://github.com/WaveSpeedAI/wavespeed-cli/releases/tag/v$version" `
            --submit --token $env:WINGET_TOKEN
